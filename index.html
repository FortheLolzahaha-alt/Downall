<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a2332;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #e2e8f0;
            color: #0f172a;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
        }

        button.btn-fetch {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.btn-fetch:hover {
            background-color: #1d4ed8;
        }

        .yt-btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #ff0000;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            text-align: center;
            transition: background 0.2s ease;
        }

        .yt-btn:hover {
            background-color: #cc0000;
        }

        #result {
            margin-top: 20px;
            word-break: break-all;
            font-size: 0.95rem;
        }

        .error {
            color: #ef4444;
        }

        .success a {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 20px;
            background-color: #10b981;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }

        .success a:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Video Downloader</h1>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste link here...">
            <button class="btn-fetch" id="fetchBtn">Fetch</button>
        </div>

        <a href="https://app.ytdown.to/en38/" target="_blank" class="yt-btn">
            Open YouTube Downloader (ytdown) ↗
        </a>

        <div id="result"></div>
    </div>

    <script>
        const BACKEND_URL = "https://downall.onrender.com";

        document.getElementById('fetchBtn').addEventListener('click', async () => {
            const inputUrl = document.getElementById('urlInput').value.trim();
            const resultDiv = document.getElementById('result');
            resultDiv.className = '';
            resultDiv.innerHTML = '';

            if (!inputUrl) {
                resultDiv.className = 'error';
                resultDiv.innerText = 'Error: Please enter a URL.';
                return;
            }

            // Redirect YouTube links straight to ytdown
            if (inputUrl.includes('youtube.com') || inputUrl.includes('youtu.be')) {
                window.open('https://app.ytdown.to/en38/', '_blank');
                resultDiv.innerHTML = 'Opening ytdown for YouTube video...';
                return;
            }

            // Process all other websites through Render backend
            resultDiv.innerText = 'Fetching download stream...';

            try {
                const response = await fetch(`${BACKEND_URL}/download?url=${encodeURIComponent(inputUrl)}`);
                const data = await response.json();

                if (response.ok && data.download_url) {
                    const proxyUrl = `${BACKEND_URL}/proxy?media_url=${encodeURIComponent(data.download_url)}&original_url=${encodeURIComponent(data.original_url || inputUrl)}`;
                    
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <p>Media extracted successfully!</p>
                        <a href="${proxyUrl}" download="video.mp4">Download Video</a>
                    `;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `Error: ${data.message || 'Failed to extract stream.'}`;
                }
            } catch (err) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `Error: Unable to reach backend server. ${err.message}`;
            }
        });
    </script>
</body>
</html>
